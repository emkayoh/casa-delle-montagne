{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{% block title %}Soapbook{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'inventory/css/site.css' %}">

    {% block extra_head %}{% endblock %}
</head>

<body>


    <header>
        <div class="brand">
            <img src="{% static 'inventory/images/brand.png' %}" alt="Soapmaker logo" class="brand-logo">

            <h1>
                <a href="{% url 'inventory:product_list' %}">
                    Soapbook
                </a>
            </h1>
        </div>

        <nav>
            <a href="{% url 'inventory:product_list' %}">Products</a>
            <a href="{% url 'inventory:ingredient_list' %}">Ingredients</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>

</html>
