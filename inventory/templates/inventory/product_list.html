{% extends "base.html" %}

{% block title %}
Products — Soapbook
{% endblock %}

{% block content %}

<h2>Products</h2>

{% if products %}
    <ul>
        {% for product in products %}
            <li>
                <a href="{% url 'inventory:label_preview' product.pk %}">
                    {{ product.name }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No products have been added yet.</p>
{% endif %}

{% endblock %}
